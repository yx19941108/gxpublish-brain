<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>manuscript_review 首页高保真设计稿 - Desktop</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="desktop-body">
    <main class="desktop-page">
      <section class="hero-shell">
        <article class="hero-card">
          <div class="hero-head">
            <div>
              <h1 class="hero-title">广西数智出版传媒有限公司<br />出版业务系统首页</h1>
              <p class="hero-subtitle">
                围绕出版业务协同与稿件审校管理，提供统一、清晰的业务入口，帮助用户快速进入常用工作页面，提升日常处理效率。
              </p>
            </div>
            <div class="meta-pill">首页</div>
          </div>
        </article>
      </section>

      <section class="content-grid">
        <article class="surface-card">
          <div class="section-head">
            <div>
              <h2 class="section-title">业务模块</h2>
            </div>
          </div>

          <div class="entry-grid">
            <article class="entry-card">
              <span class="entry-ornament"></span>
              <div class="entry-top">
                <div class="entry-icon blue">台</div>
                <div class="entry-status">台账入口</div>
              </div>
              <h3>审校台账</h3>
              <p>查看审校流程进度，按标题、稿件号和状态进行检索，并进入详情页。</p>
              <div class="entry-meta">
                <span class="mini-pill blue">点击进入</span>
              </div>
            </article>

            <article class="entry-card">
              <span class="entry-ornament"></span>
              <div class="entry-top">
                <div class="entry-icon orange">发</div>
                <div class="entry-status">发起入口</div>
              </div>
              <h3>我发起的</h3>
              <p>查看本人发起的流程记录，继续跟进当前状态和后续处理。</p>
              <div class="entry-meta">
                <span class="mini-pill orange">点击进入</span>
              </div>
            </article>

            <article class="entry-card">
              <span class="entry-ornament"></span>
              <div class="entry-top">
                <div class="entry-icon green">待</div>
                <div class="entry-status">待办入口</div>
              </div>
              <h3>我的待办</h3>
              <p>进入待办任务页面，集中处理当前待审批的业务事项。</p>
              <div class="entry-meta">
                <span class="mini-pill green">点击进入</span>
              </div>
            </article>

            <article class="entry-card">
              <span class="entry-ornament"></span>
              <div class="entry-top">
                <div class="entry-icon navy">已</div>
                <div class="entry-status">已办入口</div>
              </div>
              <h3>我的已办</h3>
              <p>查看已处理事项与结果记录，便于后续回看和追踪。</p>
              <div class="entry-meta">
                <span class="mini-pill blue">点击进入</span>
              </div>
            </article>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
