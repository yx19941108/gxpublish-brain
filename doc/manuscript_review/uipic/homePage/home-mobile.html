<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>manuscript_review 首页高保真设计稿 - Mobile</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="mobile-body">
    <main class="mobile-canvas">
      <section class="phone-card">
        <div class="phone-shell">
          <div class="phone-status">
            <span>09:41</span>
            <span>5G 96%</span>
          </div>

          <div class="phone-screen">
            <section class="mobile-hero">
              <h1>广西数智出版传媒有限公司<br />出版业务系统首页</h1>
              <p>围绕出版业务协同与稿件审校管理，提供统一、清晰的业务入口，帮助用户快速进入常用工作页面。</p>
            </section>

            <section class="mobile-section">
              <h2>业务模块</h2>

              <div class="mobile-entry-list">
                <article class="mobile-entry">
                  <span class="entry-ornament"></span>
                  <div class="mobile-entry-top">
                    <div class="entry-icon blue">台</div>
                    <span class="entry-status">台账入口</span>
                  </div>
                  <h3>审校台账</h3>
                  <p>查看审校流程进度，并进入详情页继续处理。</p>
                  <div class="mobile-entry-meta">
                    <span class="mini-pill blue">点击进入</span>
                  </div>
                </article>

                <article class="mobile-entry">
                  <span class="entry-ornament"></span>
                  <div class="mobile-entry-top">
                    <div class="entry-icon orange">发</div>
                    <span class="entry-status">发起入口</span>
                  </div>
                  <h3>我发起的</h3>
                  <p>查看本人发起的流程记录和处理状态。</p>
                  <div class="mobile-entry-meta">
                    <span class="mini-pill orange">点击进入</span>
                  </div>
                </article>

                <article class="mobile-entry">
                  <span class="entry-ornament"></span>
                  <div class="mobile-entry-top">
                    <div class="entry-icon green">待</div>
                    <span class="entry-status">待办入口</span>
                  </div>
                  <h3>我的待办</h3>
                  <p>集中处理当前待审批的业务事项。</p>
                  <div class="mobile-entry-meta">
                    <span class="mini-pill green">点击进入</span>
                  </div>
                </article>

                <article class="mobile-entry">
                  <span class="entry-ornament"></span>
                  <div class="mobile-entry-top">
                    <div class="entry-icon navy">已</div>
                    <span class="entry-status">已办入口</span>
                  </div>
                  <h3>我的已办</h3>
                  <p>查看已处理事项与结果记录，便于后续回看和追踪。</p>
                  <div class="mobile-entry-meta">
                    <span class="mini-pill blue">点击进入</span>
                  </div>
                </article>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
